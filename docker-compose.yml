# BiteOrder – whole stack in containers:  docker compose up --build
# Needs a .env file next to this one (copy .env.docker.example -> .env and set the secrets).
# The frontend is served on http://localhost:8080 by default; set WEB_PORT in .env if that port is already in use.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/biteorder
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@biteorder.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CLIENT_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - "5001:5001"

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE: http://localhost:5001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
