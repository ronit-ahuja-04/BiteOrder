server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths (/login, /admin ...) are handled by React Router
  location / {
    try_files $uri /index.html;
  }

  # Cache hashed build assets for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
